services:

  # ===== BANKING SERVICE =====
  banking-service:
    build: ./banking-service
    container_name: banking-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://banking-db:5432/banking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      banking-db:
        condition: service_healthy

  banking-db:
    image: postgres:15
    container_name: banking-db
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== ROULETTE SERVICE =====
  roulette-service:
    build: ./roulette-service
    container_name: roulette-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://roulette-db:5432/roulette_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      BANKING_SERVICE_URL: http://banking-service:8080
    depends_on:
      roulette-db:
        condition: service_healthy
      banking-service:
        condition: service_started

  roulette-db:
    image: postgres:15
    container_name: roulette-db
    environment:
      POSTGRES_DB: roulette_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== SLOTMACHINE SERVICE =====
  slotmachine-service:
    build: ./slotmachine-service
    container_name: slotmachine-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://slotmachine-db:5432/slotmachine_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      BANKING_SERVICE_URL: http://banking-service:8080
    depends_on:
      slotmachine-db:
        condition: service_healthy
      banking-service:
        condition: service_started

  slotmachine-db:
    image: postgres:15
    container_name: slotmachine-db
    environment:
      POSTGRES_DB: slotmachine_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5